services:
  postgres:
    image: postgres:16
    container_name: postgres-pontocerto
    environment:
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: pontocerto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pontocerto-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-pontocerto
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pontocerto-net

networks:
  pontocerto-net:

volumes:
  postgres-data:
