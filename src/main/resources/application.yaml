spring:
  application:
    name: pontocerto

  datasource:
    url: jdbc:postgresql://localhost:5432/pontocerto_db
    username: postgres
    password: senha123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Upload de anexos (afastamentos): até 5 MB por arquivo
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: "minha-chave-secreta-bem-longa-e-dificil-de-adivinhar-troque-isso-depois"
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

pontocerto:
  # Pasta onde ficam os anexos de afastamento (relativa a onde a API é iniciada)
  uploads-dir: uploads
